name: Deploy ke Hostinger

# Setiap push ke main: build production, lalu kirim hanya file yang berubah ke Hostinger lewat SSH (rsync).
# Butuh Secrets: SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY, SSH_DIR. Variables (opsional): PUBLIC_GA4_ID, PUBLIC_TURNSTILE_SITE_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Build dan upload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build production: gagal bila ada placeholder atau data dummy yang tampil.
      - name: Build production
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://rafizaweb.com
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Siapkan kunci SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      # rsync membandingkan isi (checksum), jadi hanya file baru atau berubah yang dikirim. Tanpa --delete:
      # file lain di server (mis. sisa WordPress) tidak dihapus otomatis.
      - name: Upload ke Hostinger (rsync lewat SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_DIR: ${{ secrets.SSH_DIR }}
        run: |
          rsync -az --checksum --stats \
            --exclude '.fuse_hidden*' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes" \
            apps/web/dist/client/ "$SSH_USER@$SSH_HOST:$SSH_DIR"

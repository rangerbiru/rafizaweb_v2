name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      # Build preview mengizinkan data dummy/placeholder (ALLOW_DUMMY=true); build production ada di job "launch-guard".
      - run: pnpm build:preview
      - run: pnpm --filter @rafizaweb/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Lighthouse CI (mobile)
        run: pnpm dlx @lhci/cli@0.15 autorun --config=./lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  launch-guard:
    name: Placeholder & dummy (wajib lulus di main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informasional di PR; di branch main wajib lulus (PRD §13, §16).
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:placeholders
      - name: Build production (gagal jika ada placeholder/dummy tampil)
        run: pnpm build
